# Publica a API no Azure App Service (app "viteme-api").
#
# Criado pelo Centro de Implantação do Azure e ajustado pela equipe:
#  - só publica DEPOIS que o workflow "CI" (build + testes) passa na main;
#  - publica exatamente o commit que passou no CI;
#  - publica só o projeto Viteme.Api (não a solução inteira, que inclui os testes);
#  - apaga o que havia na pasta do app antes de copiar (clean) e fixa o comando de início: com sobras de
#    publicações antigas (ex.: Viteme.Tests.runtimeconfig.json) o Azure não sabe qual DLL iniciar e sobe a
#    página padrão dele no lugar da API;
#  - uma publicação por vez.
# Também pode ser disparado à mão: Actions > este workflow > Run workflow.
#
# O login no Azure é por identidade (OIDC): os três segredos AZUREAPPSERVICE_* foram criados pelo
# próprio Azure ao ligar o GitHub. Não precisa de perfil de publicação.
# Atenção: cada publicação reinicia a API. Evite merges na main perto de uma demonstração.
# Se o Azure regravar este arquivo (por exemplo, ao refazer a ligação no portal), reaplique estes ajustes.

name: Publicar API no Azure (viteme-api)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-viteme-api
  cancel-in-progress: false

jobs:
  publicar:
    # Automático: só quando o CI de um push na main terminou com sucesso. Manual: sempre.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # necessário para o login OIDC no Azure
      contents: read  # necessário para o checkout

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publicar Viteme.Api (Release)
        run: |
          dotnet publish Viteme.Api/Viteme.Api.csproj -c Release -o publicado
          cd publicado && zip -qr ../viteme-api.zip .

      - name: Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_95707E95CEED49FBAB3D3793108E1FE0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EAB9CBCF5C9142F892E8AA3EEF3F3E60 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_481C85C2AEEE421B88499A65884B2345 }}

      - name: Enviar para o App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: viteme-api
          slot-name: Production
          package: viteme-api.zip
          type: ZIP
          clean: true
          startup-command: dotnet Viteme.Api.dll
