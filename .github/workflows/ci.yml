name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Banco real para os testes de persistência (cada execução cria e remove um banco temporário).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VITEME_TESTES_DB: Host=localhost;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Viteme.sln

      - name: Build
        run: dotnet build Viteme.sln --no-restore -c Release

      - name: Test
        run: dotnet test Viteme.sln --no-build -c Release
